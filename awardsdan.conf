server {
    listen 443 ssl;
    server_name awardsdan.com www.awardsdan.com;
    root /var/www/event-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://localhost:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/event-backend/static/;
    }

    location /media/ {
        alias /var/www/event-backend/media/;
    }

    ssl_certificate /etc/letsencrypt/live/awardsdan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awardsdan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name awardsdan.com www.awardsdan.com;
    return 301 https://awardsdan.com$request_uri;
}
